name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the wasm target
        run: rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Full test pass (fmt, debug tests, release tests, wasm ABI)
        run: ./test.sh

  # The crates.io install path. Stage the compiled engine, package all three
  # crates and verify-build the tarballs — inside a tarball there is no sibling
  # wasm/ crate, so the cli's build script uses the staged engine, exactly as
  # `cargo install packdiff` will. Then prove the promise that install makes:
  # with the wasm target removed, the packaged crate still installs and runs.
  # Merging auto-publishes, so works-from-checkout-only regressions must be
  # caught here, not by a failed release.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Stage the compiled engine into the cli crate
        run: ./stage-engine.sh
      # `--allow-dirty`: cargo counts the staged engine as an uncommitted file (it is
      # gitignored, but it is in the package list); the checkout itself is clean.
      - name: Package and verify-build the three crate tarballs
        run: cargo package --workspace --allow-dirty
      # The tarball asks the registry for `packdiff-dto` at the PR's version, which is
      # not published yet, so that one dependency is patched to the local checkout.
      - name: Install the packaged cli crate on a toolchain without the wasm target
        run: |
          rustup target remove wasm32-unknown-unknown
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          cargo install --path "target/package/packdiff-$version" --root "$RUNNER_TEMP/packdiff-install" \
            --config "patch.crates-io.packdiff-dto.path=\"$PWD/dto\""
          "$RUNNER_TEMP/packdiff-install/bin/packdiff" --version

  # The published API contract: packdiff-dto's public API must stay
  # semver-compatible with the latest crates.io release. The version ladder
  # bumps 0.3.z on every PR, so additive API changes always pass; a breaking
  # dto change fails here until the PR carries 0.4.0.
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: packdiff-dto
